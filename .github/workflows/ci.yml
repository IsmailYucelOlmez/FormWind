name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # Görsel testlerin çizimleri; bu ortamın referansı yoksa testler yalnızca dışa aktarır.
      FORMWIND_VISUAL_EXPORT: ${{ github.workspace }}\visual-export
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build FormWind.sln -c Release

      - name: Test (net472 + net8.0-windows)
        run: dotnet test FormWind.sln -c Release --no-build --logger "trx" --results-directory TestResults

      # UI Automation istemcisi süreç genelinde ayar değiştirdiğinden ayrı bir süreçte çalışır.
      - name: Test (UI Automation)
        run: dotnet test tests/FormWind.Tests -c Release --no-build -f net472 --filter Category=UIAutomation
        env:
          FORMWIND_UIA: "1"

      - name: Pack
        run: dotnet pack FormWind.sln -c Release --no-build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      # Bu klasör indirilip tests/FormWind.Tests/Baselines altına eklenirse CI ortamının görsel referansı olur.
      - name: Upload visual snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: |
            visual-export
            tests/FormWind.Tests/bin/Release/net472/VisualDiffs
          if-no-files-found: ignore

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages
